<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World & Video Dubbing</title>
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  <div class="theme-switch-wrapper">
    <label class="theme-switch" for="checkbox">
      <input type="checkbox" id="checkbox" />
      <div class="slider round"></div>
    </label>
  </div>
  <h1>Hello, world!</h1>

  <div class="contact-form-container">
    <h2>제휴 문의</h2>
    <form action="https://formspree.io/f/xnjdlvva" method="POST">
      <div class="form-group">
        <label for="name">이름:</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="email">이메일:</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="message">문의 내용:</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit">보내기</button>
    </form>
  </div>

  <section id="dubbing-section">
      <h1>Video Dubbing</h1>
      <div class="input-group">
          <label for="video-upload">Upload Video</label>
          <input type="file" id="video-upload" accept="video/*">
      </div>
      <div class="input-group">
          <label for="script-input">Enter Script</label>
          <textarea id="script-input" rows="5"></textarea>
      </div>
      <button id="dub-button">Dub Video</button>
      <div id="video-container"></div>
  </section>

  <div id="disqus_thread"></div>
